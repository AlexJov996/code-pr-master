# Review settings for this repository (read by the GitHub App at the PR head and by the CLI from the cwd).
language: en-US
tone_instructions: ""
model: claude-opus-5-5
reviews:
  profile: chill            # chill | assertive | quiet
  path_filters:
    - "!**/*.lock"
    - "!pnpm-lock.yaml"
    - "!**/fixtures/**"
  path_instructions:
    - path: "src/core/**"
      instructions: "This is the review engine. Flag anything that could post a comment on the wrong line or leak a secret into a prompt."
    - path: "src/github/**"
      instructions: "Check every GitHub API call handles 404 and 422 explicitly."
  auto_review:
    enabled: true
    drafts: false
    base_branches: []       # empty = every base branch; otherwise globs like "main", "release/*"
triage:
  ai_assessment: false      # true = also ask Claude for value/risk per PR (needs ANTHROPIC_API_KEY)
  saved_views:
    - id: security-watch
      name: Security watch
      filter:
        risk: [High]
    - id: release-train
      name: Release train
      filter:
        base_branches: ["release/*"]
    - id: agent-prs
      name: Agent-created PRs
      filter:
        tags: [Agent-created]
security:
  pr_scans: true            # scan the added lines of every reviewed PR and post verified findings inline
  auto_fix: false           # true = draft a fix PR for confirmed Critical/High findings (needs ANTHROPIC_API_KEY)
  min_severity: Medium
  exclude:
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/fixtures/**"
verify:
  base_url: ""              # URL of the running app the bot tests; empty = @carrot-review verify replies with setup instructions
  journeys_file: .carrot-review/journeys.yaml
  headless: true
  setup:
    install: ""             # e.g. pnpm install
    start: ""               # e.g. pnpm dev
    ready_url: ""           # e.g. http://localhost:3000/
